<!-- Floating export panel for client-side student answers.
     Included site-wide via include-after-body. Only appears on pages
     that contain .answer-field widgets. Nothing leaves the browser. -->
<div id="answers-panel" class="answers-panel no-print" hidden>
  <span class="answers-panel-label">My answers</span>
  <button type="button" id="answers-download" class="answers-btn">⬇ Download all</button>
  <button type="button" id="answers-copy" class="answers-btn">⧉ Copy this page</button>
  <span id="answers-status" class="answers-status" aria-live="polite"></span>
</div>
<script>
(function () {
  "use strict";
  var PREFIX = "micronsws:";
  var pageKey = location.pathname;
  var pageTitle = (document.title || pageKey)
    .replace(/\s*[–—-]\s*MICrONS.*$/i, "").trim() || pageKey;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function keyFor(id) { return PREFIX + pageKey + "::" + id; }

  var fields = Array.prototype.slice.call(document.querySelectorAll(".answer-field"));
  var panel = document.getElementById("answers-panel");
  if (!fields.length) { return; }          // no widgets on this page -> panel stays hidden
  if (panel) { panel.hidden = false; }

  // restore saved values + wire autosave
  fields.forEach(function (el) {
    var id = el.getAttribute("data-answer-id");
    var promptEl = el.previousElementSibling;
    var prompt = promptEl ? promptEl.textContent.trim() : id;
    var raw = lsGet(keyFor(id));
    if (raw) {
      try { var o = JSON.parse(raw); if (o && typeof o.v === "string") { el.value = o.v; } }
      catch (e) { el.value = raw; }
    }
    el.addEventListener("input", function () {
      lsSet(keyFor(id), JSON.stringify({ v: el.value, p: prompt, page: pageKey, title: pageTitle }));
    });
  });

  function collectAll() {
    var byPage = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k.indexOf(PREFIX) !== 0) { continue; }
        var o; try { o = JSON.parse(localStorage.getItem(k)); } catch (e) { continue; }
        if (!o || !o.v || !o.v.trim()) { continue; }
        var pg = o.title || o.page || "Answers";
        (byPage[pg] = byPage[pg] || []).push(o);
      }
    } catch (e) {}
    return byPage;
  }

  function toMarkdown(byPage) {
    var out = ["# MICrONS Workshop — my answers", "",
               "_Exported " + new Date().toLocaleString() + "_", ""];
    var pages = Object.keys(byPage);
    if (!pages.length) { return out.join("\n") + "\n\n(No answers recorded yet.)\n"; }
    pages.forEach(function (pg) {
      out.push("## " + pg, "");
      byPage[pg].forEach(function (o) { out.push("**" + (o.p || "Response") + "**", "", o.v, ""); });
    });
    return out.join("\n") + "\n";
  }

  function download(text) {
    var blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "microns-workshop-answers-" + new Date().toISOString().slice(0, 10) + ".md";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function flash(msg) {
    var s = document.getElementById("answers-status");
    if (!s) { return; }
    s.textContent = msg;
    setTimeout(function () { s.textContent = ""; }, 2500);
  }

  var dl = document.getElementById("answers-download");
  if (dl) { dl.addEventListener("click", function () { download(toMarkdown(collectAll())); flash("Downloaded ✓"); }); }

  var cp = document.getElementById("answers-copy");
  if (cp) {
    cp.addEventListener("click", function () {
      var one = {}; one[pageTitle] = [];
      fields.forEach(function (el) {
        var promptEl = el.previousElementSibling;
        one[pageTitle].push({ p: promptEl ? promptEl.textContent.trim() : el.getAttribute("data-answer-id"), v: el.value });
      });
      var text = toMarkdown(one);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { flash("Copied this page ✓"); },
          function () { flash("Copy failed — use Download"); });
      } else { flash("Copy unsupported — use Download"); }
    });
  }
})();
</script>
